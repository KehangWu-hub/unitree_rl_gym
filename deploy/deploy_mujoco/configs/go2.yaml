policy_path: "{LEGGED_GYM_ROOT_DIR}/logs/rough_go2_45x60_rewards/exported/policies/policy_1.pt"
deploy_config_path: "{LEGGED_GYM_ROOT_DIR}/logs/rough_go2_45x60_rewards/exported/params/deploy.yaml"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/go2/mjcf/scene_flat.xml"

simulation_duration: 30.0
simulation_dt: 0.002
command: [0.5, 0.0, 0.0]

# 训练时用的是 URDF，部署时用的是 MJCF，两者的关节参数和摩擦设置不同。
# 加载 MJCF 后用下面的值覆盖这些设置，让仿真尽量接近训练环境。
model_overrides:
  joint_damping: 0.0
  armature: 0.0
  friction_loss: 0.0
  sliding_friction: 1.0

fall_height: 0.12
fall_tilt: 1.0
realtime: true
